<!doctype html>
<!-- 开发用：所有车辆模型一字排开检查造型（npm run serve 后打开 /tools/dev/vehicles.html） -->
<html><head><meta charset="utf-8"><base href="../../"><style>body{margin:0;background:#222}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three-build/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { Vehicle } from './src/player/vehicle.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x30343c);
const pm = new THREE.PMREMGenerator(r); const hdr = await new RGBELoader().loadAsync('assets/hdr/venice_sunset_1k.hdr'); scene.environment = pm.fromEquirectangular(hdr).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 8, 6); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshStandardMaterial({ color: 0x2b2c30 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200); cam.position.set(14, 7, 20); cam.lookAt(2, 1, 0);
const types = ['sedan', 'taxi', 'van', 'pickup', 'bus', 'ledtruck', 'coffee', 'scooter'];
types.forEach((t, i) => { const v = new Vehicle(t, { text: 'OUT', textColor: '#ff2d2d', color: t === 'sedan' ? 0x2b3a55 : undefined }); v.root.position.set((i - 3.5) * 3.6, 0, (i % 2) * 2); v.root.rotation.y = i >= 5 ? -1.2 : 0.6; scene.add(v.root); });
r.render(scene, cam);
window.ready = true;
</script></body></html>
