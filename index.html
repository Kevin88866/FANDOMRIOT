<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>饭圈风云 · FANDOM RIOT</title>
<link rel="stylesheet" href="src/ui/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three-build/three.module.min.js",
  "three/addons/": "./vendor/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="stats">
    <div class="stat"><span class="lbl">资金</span><span id="hud-money">₩0</span></div>
    <div class="stat"><span class="lbl">粉丝</span><span id="hud-fans">0</span></div>
    <div class="stat"><span class="lbl">粉丝团</span><span id="hud-club">0</span></div>
    <div class="stat heat"><span class="lbl">争议度</span><div class="bar"><i id="hud-heat"></i></div></div>
  </div>
  <div id="clock"><span id="hud-week">第1周</span><b id="hud-time">18:00</b><span id="hud-phase">行动日</span></div>
  <div id="objective"></div>
  <div id="opps"></div>
  <div id="pushes"></div>
  <div id="inventory"></div>
  <div id="prompt" class="hidden"></div>
  <div id="minimap"><canvas id="minimap-c" width="180" height="180"></canvas></div>
  <div id="keys"></div>
</div>

<div id="photo-ui" class="hidden">
  <div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><div class="grid"></div></div>
  <div id="photo-tags"></div>
  <div id="photo-hint"></div>
  <div id="photo-count"></div>
  <div id="photo-box"></div>
  <div id="photo-meter"><span>画面质量</span><div><i id="photo-meter-i"></i></div></div>
  <div id="flash"></div>
</div>

<div id="place-ui" class="hidden"></div>
<div id="toasts"></div>
<div id="modal" class="hidden"></div>
<div id="fade"></div>

<div id="loading">
  <div class="logo">饭圈风云<small>FANDOM&nbsp;RIOT · SEOUL</small></div>
  <div class="lbar"><i id="lbar"></i></div>
  <div id="ltext">正在加载首尔...</div>
  <div id="ltip"></div>
</div>
<div id="err" class="hidden"><div class="err-box"><h2>出错了 😵</h2><p>游戏遇到了一个错误。你可以继续游戏（可能不稳定），或者重新载入（会回到上次的自动存档）。</p>
  <pre id="err-msg"></pre><div class="row"><button class="btn" id="err-copy">复制错误信息</button><button class="btn" id="err-go">继续游戏</button><button class="btn pri" id="err-reload">重新载入</button></div></div></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
